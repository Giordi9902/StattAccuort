# Scrapes every API replica: Docker DNS resolves `api` to one address per container, so scaling
# the service needs no change here.
global:
    scrape_interval: 15s
    evaluation_interval: 30s

rule_files:
    - alerts.yml

scrape_configs:
    - job_name: api
      dns_sd_configs:
          - names: [api]
            type: A
            port: 8787
            refresh_interval: 15s
