<!doctype html>
<html lang="it" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon-32x32.png" />
    <!-- Open the TCP+TLS connections to the map-tile and API hosts during HTML parse, so the
         handshakes are already done when maplibre requests tiles and the route loaders fetch
         data (otherwise those connections open ~3-4s in, on the critical path to LCP).
         crossorigin is required: both origins are reached via CORS fetch (vector tiles / JSON). -->
    <link rel="preconnect" href="https://tiles.stattaccuort.it" crossorigin />
    <link rel="preconnect" href="https://api.stattaccuort.it" crossorigin />
    <!-- Paints the iOS status-bar / dynamic-island area with the card color (matches the
         report form and the map search bar). Keep in sync with --card in src/index.css. -->
    <meta name="theme-color" content="#25272b" />
    <!-- Lock page scale: the map owns pinch-zoom, so the page itself must never zoom.
         This also stops iOS Safari auto-zooming when the (position:fixed) search input is focused. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.stattaccuort.it/" />
    <meta property="og:title" content="Statt’Accuort - Controlli in tempo reale" />
    <meta
      property="og:description"
      content="Guarda i controlli dei biglietti sulla mappa e segnalane di nuovi in tempo reale."
    />
    <meta property="og:image" content="https://app.stattaccuort.it/og-image.jpg" />
    <link rel="canonical" href="https://app.stattaccuort.it/" />
    <meta
      name="description"
      content="Statt’Accuort è una web app che permette di segnalare i controlli dei biglietti sui mezzi pubblici di Napoli e di essere avvisati in tempo reale."
    />
    <title>Statt’Accuort</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
