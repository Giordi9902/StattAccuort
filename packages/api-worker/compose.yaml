# Local PostgreSQL for development and tests: `docker compose up -d`.
# Creates `stattaccuort` (dev) and `stattaccuort_test` (vitest) — see postgres-init/.
services:
    postgres:
        image: postgres:18.0-alpine3.22
        container_name: stattaccuort-postgres
        environment:
            POSTGRES_DB: stattaccuort
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql
            - ./postgres-init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
